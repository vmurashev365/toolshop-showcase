name: Toolshop QA Risk Gates

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toolshop-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-gates:
    name: Static · Lint, Unit Tests, Typecheck & Discovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:static

  browser-gates-local-sut:
    name: Gate · API & Browser Regression (isolated Toolshop)
    needs: static-gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TARGET_ENV: local
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers (Chromium & WebKit)
        timeout-minutes: 8
        run: npx playwright install --with-deps chromium webkit
      - name: Start and verify the isolated Toolshop stack
        id: start-sut
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p reports/startup
          bash scripts/start-toolshop.sh "$RUNNER_TEMP/toolshop-sut" 2>&1 | tee reports/startup/toolshop.log
      - name: Gate · Margin & Security (API)
        if: ${{ !cancelled() && steps.start-sut.outcome == 'success' }}
        run: npm run test:api
      - name: Watch · Known Spec Discrepancies (API)
        if: ${{ !cancelled() && steps.start-sut.outcome == 'success' }}
        run: npm run test:discrepancies:api
      - name: Gate · Executable Business Specs (BDD)
        if: ${{ !cancelled() && steps.start-sut.outcome == 'success' }}
        run: npm run test:bdd
      - name: Gate · Mobile WebKit/Chromium Money Path
        if: ${{ !cancelled() && steps.start-sut.outcome == 'success' }}
        run: npm run test:mobile
      - name: Gate · A11y, Localization & Fault Controls
        if: ${{ !cancelled() && steps.start-sut.outcome == 'success' }}
        run: npm run test:ux
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() && steps.start-sut.outcome == 'failure' }}
        with:
          name: diagnostic-toolshop-startup
          path: reports/startup/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() && steps.start-sut.outcome == 'success' }}
        with:
          name: report-local-api-margin-security
          path: reports/pw-api/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() && steps.start-sut.outcome == 'success' }}
        with:
          name: report-local-known-discrepancies
          path: reports/pw-discrepancies/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() && steps.start-sut.outcome == 'success' }}
        with:
          name: report-local-bdd
          path: reports/bdd/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() && steps.start-sut.outcome == 'success' }}
        with:
          name: report-local-mobile
          path: reports/pw-mobile/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() && steps.start-sut.outcome == 'success' }}
        with:
          name: report-local-ux
          path: reports/pw-ux/
          if-no-files-found: ignore
